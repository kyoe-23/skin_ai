<svg width="100%" viewBox="0 0 680 1125" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SkinAI 이미지 분석 아키텍처 (OOD Filter 적용)</title>
<desc>브라우저 업로드 → Express 백엔드 → Flask AI 서비스(OOD pre-filter → DenseNet121 추론 → Grad-CAM → 응답 조립) → Claude Sonnet LLM 리포트 및 채팅까지의 전체 파이프라인 흐름도.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Browser -->
<rect x="220" y="30" width="240" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" fill="#D3D1C7" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">Browser / Frontend</text>

<!-- Arrow: Browser → Express -->
<line x1="340" y1="74" x2="340" y2="110" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="349" y="95" dominant-baseline="central" fill="#C2C0B6" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">POST /api/analyze/upload</text>

<!-- Express Backend -->
<rect x="85" y="110" width="510" height="104" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="125" text-anchor="middle" dominant-baseline="central" fill="#D3D1C7" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">Express backend  :3000</text>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" fill="#B4B2A9" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">multer 수신  ·  매직바이트 검증  ·  개인정보 마스킹</text>
<text x="340" y="169" text-anchor="middle" dominant-baseline="central" fill="#B4B2A9" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">Supabase Storage 업로드 (원본 보관)</text>
<text x="340" y="190" text-anchor="middle" dominant-baseline="central" fill="#B4B2A9" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">POST  http://localhost:5001/predict  (이미지 전달)</text>

<!-- Arrow: Express → Flask -->
<line x1="340" y1="214" x2="340" y2="262" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Flask outer border -->
<rect x="55" y="264" width="570" height="668" rx="12" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.45"/>
<text x="340" y="284" text-anchor="middle" dominant-baseline="central" fill="#FAF9F5" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">Flask AI service  :5001  ·  app.py</text>

<!-- Step 1 -->
<rect x="170" y="296" width="340" height="72" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="340" y="310" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">Step 1  ·  이미지 유효성 검사</text>
<text x="340" y="332" text-anchor="middle" dominant-baseline="central" fill="#AFA9EC" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">파일형식  ·  PIL 로딩  ·  해상도 하한  ·  용량 제한</text>
<text x="340" y="353" text-anchor="middle" dominant-baseline="central" fill="#AFA9EC" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">실패 시 → HTTP 400</text>

<!-- Arrow: Step1 → Step2 -->
<line x1="340" y1="368" x2="340" y2="392" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 2 OOD -->
<rect x="170" y="392" width="340" height="72" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
<text x="340" y="407" text-anchor="middle" dominant-baseline="central" fill="#FAC775" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">Step 2  ·  OOD pre-filter  [신규]</text>
<text x="340" y="429" text-anchor="middle" dominant-baseline="central" fill="#EF9F27" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">Claude Haiku vision API  ·  피부 이미지 판별</text>
<text x="340" y="450" text-anchor="middle" dominant-baseline="central" fill="#EF9F27" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">API 오류 → pass-through (서비스 중단 방지)</text>

<!-- HTTP 400 reject box -->
<rect x="60" y="477" width="110" height="44" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="0.5"/>
<text x="115" y="492" text-anchor="middle" dominant-baseline="central" fill="#F7C1C1" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">HTTP 400</text>
<text x="115" y="509" text-anchor="middle" dominant-baseline="central" fill="#F09595" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">비-피부 이미지 거절</text>

<!-- Arrow: is_skin=false -->
<path d="M 230 464 L 230 499 L 170 499" fill="none" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235" y="474" dominant-baseline="central" fill="#C2C0B6" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">is_skin=false</text>

<!-- Arrow: is_skin=true / API error → Step3 -->
<line x1="340" y1="464" x2="340" y2="548" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="349" y="508" dominant-baseline="central" fill="#C2C0B6" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">is_skin=true / API 오류</text>

<!-- Step 3 -->
<rect x="170" y="548" width="340" height="72" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="340" y="563" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">Step 3  ·  전처리</text>
<text x="340" y="585" text-anchor="middle" dominant-baseline="central" fill="#AFA9EC" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">Resize · CenterCrop(224) · Normalize (ImageNet)</text>
<text x="340" y="605" text-anchor="middle" dominant-baseline="central" fill="#AFA9EC" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">출력: Tensor (1, 3, 224, 224)</text>

<!-- Arrow: Step3 → Step4 -->
<line x1="340" y1="620" x2="340" y2="650" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 4 -->
<rect x="170" y="650" width="340" height="72" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="340" y="665" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">Step 4  ·  DenseNet121 추론</text>
<text x="340" y="687" text-anchor="middle" dominant-baseline="central" fill="#AFA9EC" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">softmax → Top-3 확률  ·  uncertain 판정</text>
<text x="340" y="707" text-anchor="middle" dominant-baseline="central" fill="#AFA9EC" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">MIN_CONFIDENCE  ·  thresholds.json 클래스별 임계값</text>

<!-- Fork: Step4 → 5a, 5b -->
<line x1="340" y1="722" x2="340" y2="742" stroke="#9C9A92" stroke-width="1" opacity="0.5"/>
<line x1="270" y1="742" x2="480" y2="742" stroke="#9C9A92" stroke-width="1" opacity="0.5"/>
<line x1="270" y1="742" x2="270" y2="752" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="742" x2="480" y2="752" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 5a Grad-CAM -->
<rect x="170" y="752" width="200" height="66" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="270" y="770" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">Step 5a  ·  Grad-CAM</text>
<text x="270" y="795" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">GradCAM denseblock4 → base64 PNG</text>

<!-- Step 5b clinical_ref -->
<rect x="380" y="752" width="200" height="66" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="480" y="770" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">Step 5b  ·  clinical_ref</text>
<text x="480" y="795" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">train.csv 캐시  ·  통계 조회</text>

<!-- Join: 5a,5b → Step6 -->
<path d="M 270 818 L 270 836 L 340 836" fill="none" stroke="#9C9A92" stroke-width="1" opacity="0.5"/>
<path d="M 480 818 L 480 836 L 340 836" fill="none" stroke="#9C9A92" stroke-width="1" opacity="0.5"/>
<line x1="340" y1="836" x2="340" y2="848" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 6 -->
<rect x="170" y="848" width="340" height="70" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="863" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">Step 6  ·  HTTP 200 응답 조립</text>
<text x="340" y="884" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">prediction  ·  gradcam  ·  clinical_ref</text>
<text x="340" y="903" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">processing_time_ms</text>

