<text x="187" y="993" text-anchor="middle" dominant-baseline="central" fill="#D3D1C7" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="14" font-weight="500">POST /report</text>
<text x="187" y="1017" text-anchor="middle" dominant-baseline="central" fill="#B4B2A9" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">Claude Sonnet  ·  리포트 생성</text>
