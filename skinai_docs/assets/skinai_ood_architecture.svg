<line x1="340" y1="918" x2="340" y2="962" stroke="#9C9A92" stroke-width="1" opacity="0.5"/>
<text x="349" y="943" dominant-baseline="central" fill="#C2C0B6" font-family="'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif" font-size="12">Frontend 비동기 호출</text>
<line x1="187" y1="962" x2="492" y2="962" stroke="#9C9A92" stroke-width="1" opacity="0.5"/>
<line x1="187" y1="962" x2="187" y2="975" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="492" y1="962" x2="492" y2="975" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>

