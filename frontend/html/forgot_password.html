<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SkinAI - 비밀번호 찾기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  @keyframes pageFadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes float1 { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(30px,-20px) scale(1.05); } }
  @keyframes float2 { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(-20px,30px) scale(1.08); } }

  body {
    font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:#f8fafc; color:#1a1a2e;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    animation:pageFadeIn 0.45s ease;
    overflow:hidden; position:relative;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse 70% 50% at 15% 5%, rgba(37,99,235,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 95%, rgba(99,102,241,0.07) 0%, transparent 60%);
    pointer-events:none; z-index:0; animation:float1 12s ease-in-out infinite;
  }
  body::after {
    content:''; position:fixed; inset:0;
    background-image: radial-gradient(circle, rgba(37,99,235,0.04) 1px, transparent 1px);
    background-size:28px 28px; pointer-events:none; z-index:0;
  }

  .container { width:100%; max-width:420px; position:relative; z-index:1; }

  .logo-wrap { text-align:center; margin-bottom:32px; }
  .logo-badge { display:inline-flex; align-items:center; gap:12px; margin-bottom:14px; }
  .logo-icon {
    width:48px; height:48px;
    background:linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(37,99,235,0.4);
  }
  .logo-icon svg { width:26px; height:26px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .logo-text { font-size:26px; font-weight:800; color:#0f172a; letter-spacing:-0.5px; }
  .logo-text span { color:#2563eb; }

  .card {
    background:#fff; border:1px solid #e8edf4; border-radius:24px; padding:38px 36px;
    box-shadow:
      0 1px 2px rgba(0,0,0,0.04),
      0 8px 32px rgba(37,99,235,0.07),
      0 24px 48px rgba(0,0,0,0.06);
  }
  .card-title { font-size:21px; font-weight:700; color:#0f172a; margin-bottom:4px; letter-spacing:-0.4px; }
  .card-sub { font-size:13px; color:#94a3b8; margin-bottom:28px; line-height:1.7; }

  .field { margin-bottom:18px; }
  .field-label { display:block; font-size:12.5px; font-weight:600; color:#475569; margin-bottom:8px; }
  .input-wrap { position:relative; }
  .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:#94a3b8; pointer-events:none; }
  input[type=email] {
    width:100%; padding:13px 14px 13px 43px;
    border:1px solid #e2e8f0; border-radius:12px;
    font-size:14px; color:#0f172a; background:#f8fafc;
    outline:none; transition:all 0.22s; font-family:inherit;
  }
  input:hover { border-color:#bfdbfe; background:#fff; }
  input:focus { border-color:#3b82f6; background:#fff; box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
  input::placeholder { color:#c4cad4; }

  .error-msg { background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:10px 14px; font-size:13px; color:#dc2626; display:none; align-items:center; gap:8px; margin-bottom:16px; }
  .error-msg.show { display:flex; }

  .submit-btn {
    width:100%; padding:14px;
    background:linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
    color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700;
    cursor:pointer; transition:all 0.22s; font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 4px 20px rgba(37,99,235,0.4); position:relative; overflow:hidden;
  }
  .submit-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
    opacity:0; transition:opacity 0.2s;
  }
  .submit-btn:hover::before { opacity:1; }
  .submit-btn:hover { transform:translateY(-1px); box-shadow:0 8px 28px rgba(37,99,235,0.5); }
  .submit-btn:active { transform:scale(0.98) translateY(0); }
  .submit-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-spinner { width:17px; height:17px; border:2.5px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
  .submit-btn.loading .btn-spinner { display:block; }
  .submit-btn.loading .btn-text { display:none; }

  .success-wrap { display:none; flex-direction:column; align-items:center; text-align:center; }
  .success-wrap.show { display:flex; }
  .success-icon {
    width:64px; height:64px;
    background:linear-gradient(135deg, #d1fae5, #a7f3d0);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    margin-bottom:20px; box-shadow:0 8px 24px rgba(16,185,129,0.25);
  }
  .success-icon svg { width:32px; height:32px; fill:none; stroke:#059669; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  .success-title { font-size:19px; font-weight:700; color:#0f172a; margin-bottom:8px; letter-spacing:-0.3px; }
  .success-desc { font-size:13px; color:#6b7280; line-height:1.8; margin-bottom:24px; }

  .card-footer { text-align:center; margin-top:24px; font-size:13px; color:#94a3b8; }
  .card-footer a { color:#2563eb; font-weight:600; text-decoration:none; transition:color 0.15s; }
  .card-footer a:hover { color:#1d4ed8; text-decoration:underline; }
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <div class="logo-badge">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 4-3 7-7 9-4-2-7-5-7-9a7 7 0 0 1 7-7z"/><path d="M12 8v4M10 10h4"/></svg>
      </div>
      <div class="logo-text">Skin<span>AI</span></div>
    </div>
  </div>

  <div class="card">
    <div id="formSection">
      <div class="card-title">비밀번호 찾기</div>
      <div class="card-sub">가입 시 등록한 이메일을 입력하시면<br>비밀번호 재설정 링크를 보내드립니다.</div>

      <div class="error-msg" id="errorMsg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorText"></span>
      </div>

      <div class="field">
        <label class="field-label">이메일</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 7 10-7"/>
          </svg>
          <input type="email" id="emailInput" placeholder="hospital@med.ac.kr" autocomplete="email">
        </div>
      </div>

      <button class="submit-btn" id="submitBtn">
        <div class="btn-spinner"></div>
        <span class="btn-text">재설정 링크 보내기</span>
      </button>
    </div>

    <div class="success-wrap" id="successSection">
      <div class="success-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="success-title">이메일을 확인하세요</div>
      <div class="success-desc" id="successDesc"></div>
      <button class="submit-btn" style="max-width:200px;" onclick="location.href='login.html'">
        <span class="btn-text">로그인으로 돌아가기</span>
      </button>
    </div>
  </div>

  <div class="card-footer"><a href="login.html">← 로그인으로 돌아가기</a></div>
</div>
<script src="../src/forgot_password.js"></script>
</body>
</html>
