<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SkinAI - 새 비밀번호 설정</title>
<link rel="icon" type="image/svg+xml" href="assets/skinai_icon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  @keyframes pageFadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  body {
    font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:#f8fafc; color:#1a1a2e;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    animation:pageFadeIn 0.45s ease; position:relative; overflow:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse 70% 50% at 15% 5%, rgba(37,99,235,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 95%, rgba(99,102,241,0.06) 0%, transparent 60%);
    pointer-events:none; z-index:0;
  }
  body::after {
    content:''; position:fixed; inset:0;
    background-image: radial-gradient(circle, rgba(37,99,235,0.04) 1px, transparent 1px);
    background-size:28px 28px; pointer-events:none; z-index:0;
  }
  .container { width:100%; max-width:400px; position:relative; z-index:1; }
  .logo-wrap { text-align:center; margin-bottom:36px; }
  .logo-badge { display:inline-flex; align-items:center; gap:10px; margin-bottom:14px; }
  .logo-icon {
    overflow:hidden; width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(37,99,235,0.35); }
  .logo-icon svg { width:24px; height:24px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .logo-text { font-size:24px; font-weight:800; color:#1a1a2e; letter-spacing:-0.5px; }
  .logo-text span { color:#2563eb; }
  .card { background:#fff; border:1px solid #e8edf4; border-radius:20px; padding:36px 32px; box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 8px 32px rgba(37,99,235,0.07), 0 24px 48px rgba(0,0,0,0.07); }
  .card-title { font-size:20px; font-weight:700; color:#111827; margin-bottom:4px; letter-spacing:-0.3px; }
  .card-sub { font-size:13px; color:#9ca3af; margin-bottom:28px; line-height:1.6; }
  .field { margin-bottom:18px; }
  .field-label { display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:7px; }
  .input-wrap { position:relative; }
  .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:#9ca3af; pointer-events:none; }
  input[type=password], input[type=text] {
    width:100%; padding:12px 44px 12px 42px;
    border:1px solid #e5e7eb; border-radius:12px;
    font-size:14px; color:#111827; background:#f9fafb;
    outline:none; transition:all 0.2s; font-family:inherit;
  }
  input:focus { border-color:#2563eb; background:#fff; box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
  input::placeholder { color:#c4cad4; }
  .pw-toggle { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#9ca3af; padding:0; display:flex; align-items:center; }
  .strength-bar { height:4px; border-radius:4px; background:#e5e7eb; margin-top:8px; overflow:hidden; }
  .strength-fill { height:100%; border-radius:4px; width:0; transition:width 0.3s, background 0.3s; }
  .strength-label { font-size:11px; color:#9ca3af; margin-top:4px; min-height:16px; }
  .error-msg { background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:10px 14px; font-size:13px; color:#dc2626; display:none; align-items:center; gap:8px; margin-bottom:16px; }
  .error-msg.show { display:flex; }
  .submit-btn { width:100%; padding:14px; background:linear-gradient(135deg,#2563eb 0%,#4f46e5 100%); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; transition:all 0.2s; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:4px; box-shadow:0 4px 20px rgba(37,99,235,0.38); position:relative; overflow:hidden; }
  .submit-btn::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 60%); pointer-events:none; }
  .submit-btn:hover { transform:translateY(-1px); box-shadow:0 8px 28px rgba(37,99,235,0.45); }
  .submit-btn:active { transform:scale(0.98); }
  .submit-btn:disabled { opacity:0.6; cursor:not-allowed; box-shadow:none; transform:none; }
  .btn-spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
  .submit-btn.loading .btn-spinner { display:block; }
  .submit-btn.loading .btn-text { display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .state-wrap { display:none; flex-direction:column; align-items:center; text-align:center; }
  .state-wrap.show { display:flex; }
  .state-icon { width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
  .state-icon.success { background:#d1fae5; }
  .state-icon.error   { background:#fef2f2; }
  .state-icon svg { width:30px; height:30px; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  .state-icon.success svg { stroke:#059669; }
  .state-icon.error   svg { stroke:#dc2626; stroke-width:2; }
  .state-title { font-size:18px; font-weight:700; color:#111827; margin-bottom:8px; }
  .state-desc  { font-size:13px; color:#6b7280; line-height:1.7; margin-bottom:24px; }
  .card-footer { text-align:center; margin-top:22px; font-size:13px; color:#9ca3af; }
  .card-footer a { color:#2563eb; font-weight:600; text-decoration:none; }
  .card-footer a:hover { text-decoration:underline; }
  #loadingSection { text-align:center; padding:24px 0; color:#9ca3af; font-size:14px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <div class="logo-badge">
      <div class="logo-icon">
        <img src="assets/skinai_icon.svg" style="width:100%;height:100%;" alt="SkinAI">
      </div>
      <div class="logo-text">Skin<span>AI</span></div>
    </div>
  </div>

  <div class="card">
    <!-- 토큰 확인 중 -->
    <div id="loadingSection">링크를 확인하는 중...</div>

    <!-- 비밀번호 입력 폼 -->
    <div id="formSection" style="display:none;">
      <div class="card-title">새 비밀번호 설정</div>
      <div class="card-sub">새로 사용할 비밀번호를 입력하세요.</div>

      <div class="error-msg" id="errorMsg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorText"></span>
      </div>

      <div class="field">
        <label class="field-label">새 비밀번호</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="pwInput" placeholder="8자 이상 입력하세요">
          <button class="pw-toggle" id="pwToggle1" type="button">
            <svg id="eyeIcon1" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <div class="field">
        <label class="field-label">비밀번호 확인</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="pwConfirm" placeholder="비밀번호를 다시 입력하세요">
          <button class="pw-toggle" id="pwToggle2" type="button">
            <svg id="eyeIcon2" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn">
        <div class="btn-spinner"></div>
        <span class="btn-text">비밀번호 변경하기</span>
      </button>
    </div>

    <!-- 링크 만료 -->
    <div class="state-wrap" id="invalidSection">
      <div class="state-icon error">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <div class="state-title">링크가 만료되었습니다</div>
      <div class="state-desc">비밀번호 재설정 링크가 만료되었거나<br>이미 사용되었습니다.<br>다시 요청해 주세요.</div>
      <button class="submit-btn" style="max-width:200px;" onclick="location.href='forgot_password.html'">
        <span class="btn-text">다시 요청하기</span>
      </button>
    </div>

    <!-- 변경 완료 -->
    <div class="state-wrap" id="successSection">
      <div class="state-icon success">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="state-title">비밀번호가 변경되었습니다</div>
      <div class="state-desc">새 비밀번호로 로그인하세요.</div>
      <button class="submit-btn" style="max-width:200px;" onclick="location.href='login.html'">
        <span class="btn-text">로그인하러 가기</span>
      </button>
    </div>
  </div>

  <div class="card-footer"><a href="login.html">← 로그인으로 돌아가기</a></div>
</div>
<script src="../src/reset_password.js"></script>
</body>
</html>
